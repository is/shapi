[loggers]
keys=root,console,console.main,hypercorn.error

[logger_root]
level=DEBUG
handlers=log_file
propagate=1

[logger_console]
qualname=console
level=DEBUG
handlers=console
propagate=1

[logger_console.main]
level=DEBUG
handlers=
qualname=main
propagate=1

[logger_hypercorn.error]
level=INFO
handlers=console
propagate=1
qualname=hypercorn.error

[logger_hypercorn.access]
level=DEBUG
handlers=log_file
propagate=0

[handlers]
keys=console,log_file,access_log_file


[handler_console]
class=StreamHandler
level=DEBUG
formatter=console
args=(sys.stdout,)


[handler_log_file]
class=logging.handlers.RotatingFileHandler
level=INFO
formatter=default
args=("log/all.log", "a", 104857600, 10, "utf-8")

[handler_access_log_file]
class=logging.handlers.RotatingFileHandler
level=INFO
formatter=default
args=("log/access.log", "a", 104857600, 10, "utf-8")

[formatters]
keys=default,console

[formatter_console]
format=%(asctime)s . %(message)s
datefmt=%H:%M:%S

[formatter_default]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S